name: MVC Build and Docker

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-mvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RaceDay.Web/RaceDay.Web.csproj
      - name: Build MVC project
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-mvc
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t raceday-mvc ./RaceDay.Web
